<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>분식집 키오스크</title>
  <link rel="stylesheet" href="CSS.css" />
</head>
<body>
  <div class="all">
    <!-- 왼쪽 화면인 메뉴화면입니다. -->
    <div class="menu">
      <div class="title"> <a href="Main2.html"><img class="return" src="홈.png" alt="홈 화면"/></a>bunsikjib</div>
      <div class="tabs">
        <button class="tab" onclick="changeCategory('분식')">bunsik</button>
        <button class="tab" onclick="changeCategory('음료')">drinks</button>
      </div>
      <!-- id="menu"로 자바스크립트 메뉴데이터의 위치를 정합니다.  -->
      <div class="menu_1" id="menu_2"></div>
    </div>
    <!-- 오른쪽 화면인 구매내역입니다. -->
    <div class="cart">
      <h1>Order Details</h1>
      <ul id="cart"></ul>
      <div class="total">Total: <span id="total">0</span>KRW</div>
      <div class="bottom">
        <div class="timer" id="timer"></div>
        <div class="buttons">
          <button class="tab_1" onclick="cleanCart()">Cancel All</button>
          <button class="tab_2" onclick="noOrder()">Checkout</button>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="JS_1.js"></script>
</body>
</html>
<!-- 결제 모달 창 -->
<div class="payment-modal" id="paymentModal">
  <div class="payment-content">
    <h2>Payment method</h2>
    <div id="paymentItems"></div>
    <p>Payment method:</p>
    <div class="payment-buttons">
      <button onclick="confirmPayment('Card')">Card</button>
      <button onclick="confirmPayment('Cash')">Cash</button>
    </div>
    <button class="close-btn" onclick="closePaymentModal()">close</button>
  </div>
</div>
