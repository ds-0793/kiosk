<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>분식집 키오스크</title>
  <link rel="stylesheet" href="CSS.css" />
</head>
<body>
  <div class="all">
    <!-- 왼쪽 화면인 메뉴화면입니다. -->
    <div class="menu">
      <div class="title"> <a href="Main.html"><img class="return" src="홈.png" alt="홈 화면"/></a>분식집</div>
      <div class="tabs">
        <button class="tab" onclick="changeCategory('분식')">분식</button>
        <button class="tab" onclick="changeCategory('음료')">음료</button>
      </div>
      <!-- id="menu"로 자바스크립트 메뉴데이터의 위치를 정합니다.  -->
      <div class="menu_1" id="menu_2"></div>
    </div>
    <!-- 오른쪽 화면인 구매내역입니다. -->
    <div class="cart">
      <h1>주문 내역</h1>
      <ul id="cart"></ul>
      <div class="total">총 합계: <span id="total">0</span>원</div>
      <div class="bottom">
        <div class="timer" id="timer"></div>
        <div class="buttons">
          <button class="tab_1" onclick="cleanCart()">전체취소</button>
          <button class="tab_2" onclick="noOrder()">결제하기</button>
        </div>
      </div>
    </div>
  </div>
  <script type="text/javascript" src="JS.js"></script>
<!-- 결제 모달 창 -->
<div class="payment-modal" id="paymentModal">
  <div class="payment-content">
    <h2>결제 수단 선택</h2>
    <div id="paymentItems"></div>
    <p>결제 수단을 선택하세요:</p>
    <div class="payment-buttons">
      <button onclick="confirmPayment('카드')">카드</button>
      <button onclick="confirmPayment('현금')">현금</button>
    </div>
    <button class="close-btn" onclick="closePaymentModal()">닫기</button>
  </div>
</div>
